############################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

############################################
# tool plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

#initialize and run tpm
run '~/.config/tmux/plugins/tpm/tpm'

############################################
## Themes plugins
set -g @plugin 'wfxr/tmux-power'
set -g @plugin "arcticicestudio/nord-tmux"
#set -g @tmux_power_theme 'snow'
set-option -g status-position top
############################################
# general keybind
set -g mouse on
bind-key x kill-pane

## set prefix
unbind C-b
set -g prefix C-space
bind C-space send-prefix

## resize-pane
bind-key -r -T prefix	M-k	resize-pane -U 5
bind-key -r -T prefix	M-j	resize-pane -D 5
bind-key -r -T prefix	M-h	resize-pane -L 5
bind-key -r -T prefix	M-l	resize-pane -R 5

## command line (i bind them in bash instead)
#bind -n M-h send-keys left
#bind -n M-l send-keys right

############################################
## tmux-yank vi-mode
set-window-option -g mode-keys vi
bind 'v' copy-mode

### VIM switching
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
#bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection c"
set -g @yank_selection_mouse 'primary'
set -g @yank_selection 'primary'
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
#bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
#bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
#bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
#bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X scroll-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X scroll-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X scroll-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X scroll-down

# Use vim keybindings in copy mode
setw -g mode-keys vi
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

## open and split panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

## utils
# mouse
set -g @scroll-speed-num-lines-per-scroll 1
# set-option -g detach-on-destroy off
bind 'm' previous-window
bind 't' new-window
bind 'T' new-session
bind 'w' kill-window
bind 'W' kill-session
bind 'C-s' source-file ~/.config/tmux/tmux.conf
